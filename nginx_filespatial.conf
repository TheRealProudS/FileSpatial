# ==============================================================================
# Nginx Virtual Host Konfiguration: filespatial.zenkner-technology.de
# Pfad auf Server: /etc/nginx/sites-available/filespatial.zenkner-technology.de
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name filespatial.zenkner-technology.de;

    # Automatische HTTPS Weiterleitung
    return 301 https://System.Management.Automation.Internal.Host.InternalHost;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filespatial.zenkner-technology.de;

    root /var/www/filespatial;
    index index.html;

    # SSL Zertifikate (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/zenkner-technology.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenkner-technology.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # BSI-konforme Security Header (Zenkner-Technology Standard)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection 1; mode=block always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security max-age=31536000; includeSubDomains; preload always;

    # Cache-Busting für statische Assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control public, max-age=31536000, immutable;
    }

    # SPA Fallback
    location / {
        try_files  / /index.html;
    }

    access_log /var/log/nginx/filespatial_access.log;
    error_log /var/log/nginx/filespatial_error.log;
}
